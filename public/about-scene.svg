<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGlow" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a3a20" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#1b1c20" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8c897f"/>
      <stop offset="45%" stop-color="#3d4040"/>
      <stop offset="85%" stop-color="#121415"/>
      <stop offset="100%" stop-color="#050606"/>
    </radialGradient>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8bf72" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#9a6e2e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="monolithGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090a0b"/>
      <stop offset="40%" stop-color="#181a1c"/>
      <stop offset="60%" stop-color="#2d3136"/>
      <stop offset="100%" stop-color="#0a0b0c"/>
    </linearGradient>
    <radialGradient id="goldHaze" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#f5d58f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f5d58f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="520" fill="url(#skyGlow)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="50" r="1"/>
    <circle cx="150" cy="90" r="0.8"/>
    <circle cx="230" cy="40" r="1.2"/>
    <circle cx="340" cy="70" r="0.7"/>
    <circle cx="420" cy="35" r="1.5" fill="#f5d58f"/>
    <circle cx="560" cy="80" r="0.9"/>
    <circle cx="680" cy="45" r="1.1"/>
    <circle cx="740" cy="110" r="0.7"/>
    <circle cx="110" cy="160" r="0.8"/>
    <circle cx="280" cy="140" r="1"/>
    <circle cx="620" cy="150" r="1.3" fill="#e4bf72"/>
    <circle cx="710" cy="190" r="0.8"/>
  </g>

  <!-- Giant Planet in Sky -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="140" fill="url(#planetGrad)"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#e8c782" stroke-width="0.8" opacity="0.3"/>
    <!-- Atmosphere rim -->
    <path d="M -138 20 A 140 140 0 0 1 20 -138" fill="none" stroke="#f6ddb0" stroke-width="2.5" opacity="0.65" filter="url(#glow)"/>
    <!-- Planet rings/curves -->
    <ellipse cx="-20" cy="10" rx="135" ry="40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08" transform="rotate(-15)"/>
  </g>

  <!-- Distant Mountain Ridges -->
  <path d="M 0 320 Q 120 280 250 310 T 500 290 T 800 330 L 800 520 L 0 520 Z" fill="#0b0d0e" opacity="0.85"/>
  <path d="M 0 350 Q 200 320 380 345 T 700 330 T 800 360 L 800 520 L 0 520 Z" fill="#08090a"/>

  <!-- Golden Horizon Light Fog -->
  <rect x="0" y="270" width="800" height="150" fill="url(#horizonGlow)"/>

  <!-- Ancient Towering Sci-Fi Monolith -->
  <g transform="translate(480, 120)">
    <!-- Main shaft -->
    <polygon points="20,0 45,0 55,270 10,270" fill="url(#monolithGrad)"/>
    <!-- Monolith edge highlights -->
    <line x1="20" y1="0" x2="10" y2="270" stroke="#f0d59c" stroke-width="1.2" opacity="0.75" filter="url(#glow)"/>
    <line x1="45" y1="0" x2="55" y2="270" stroke="#5d636b" stroke-width="0.8" opacity="0.5"/>
    <line x1="32" y1="20" x2="32" y2="250" stroke="#e8c278" stroke-width="0.8" opacity="0.4" stroke-dasharray="8 12"/>
    <!-- Monolith crown floating tip -->
    <polygon points="32,-18 42,-5 22,-5" fill="#f5d58f" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- Foreground Rugged Crater Ground -->
  <path d="M 0 410 Q 180 390 350 420 T 650 400 T 800 425 L 800 520 L 0 520 Z" fill="#060708"/>
  <ellipse cx="400" cy="460" rx="420" ry="80" fill="url(#goldHaze)"/>

  <!-- Distant Explorer Silhouette Walking on Ridge -->
  <g transform="translate(290, 365) scale(0.9)">
    <!-- shadow -->
    <ellipse cx="6" cy="38" rx="14" ry="4" fill="#000000" opacity="0.6"/>
    <!-- body -->
    <ellipse cx="6" cy="18" rx="6" ry="12" fill="#040405"/>
    <!-- backpack/suit -->
    <rect x="-1" y="10" width="6" height="12" rx="2" fill="#040405"/>
    <!-- helmet -->
    <circle cx="6" cy="6" r="5.5" fill="#0a0b0d"/>
    <circle cx="8" cy="5" r="2.5" fill="#f5d58f" opacity="0.8" filter="url(#glow)"/>
    <!-- legs -->
    <line x1="4" y1="28" x2="2" y2="38" stroke="#040405" stroke-width="3"/>
    <line x1="8" y1="28" x2="11" y2="38" stroke="#040405" stroke-width="3"/>
  </g>

  <!-- Cosmic ambient particle lights -->
  <circle cx="490" cy="380" r="1.5" fill="#f5d58f" opacity="0.8" filter="url(#glow)"/>
  <circle cx="530" cy="410" r="1.2" fill="#f5d58f" opacity="0.6"/>
  <circle cx="680" cy="360" r="1.8" fill="#e8c782" opacity="0.7" filter="url(#glow)"/>
</svg>
