<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="hudGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a2a3a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#051019" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#03070b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with tech grid -->
  <rect width="600" height="360" fill="url(#hudGlow)"/>
  <g stroke="#00d4ff" stroke-width="0.3" opacity="0.15">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Left HUD telemetry cards -->
  <g transform="translate(35, 45)">
    <rect width="115" height="75" rx="4" fill="#04121d" stroke="#00e5ff" stroke-width="0.6" opacity="0.8"/>
    <text x="10" y="18" fill="#5ce1e6" font-family="monospace" font-size="8" letter-spacing="1">NEURAL BIO-METRICS</text>
    <path d="M 10 45 L 30 45 L 38 28 L 46 60 L 54 40 L 62 48 L 70 45 L 105 45" fill="none" stroke="#00f0ff" stroke-width="1.2" filter="url(#neon)"/>
    <text x="10" y="65" fill="#a4f3ff" font-family="monospace" font-size="7">HR: 72 BPM · VITAL: 98%</text>

    <!-- Bar telemetry below -->
    <rect x="0" y="90" width="115" height="110" rx="4" fill="#04121d" stroke="#0077aa" stroke-width="0.5" opacity="0.7"/>
    <text x="10" y="108" fill="#5ce1e6" font-family="monospace" font-size="8" letter-spacing="1">ORGAN TELEMETRY</text>
    <rect x="10" y="122" width="95" height="4" rx="2" fill="#0b2c3d"/>
    <rect x="10" y="122" width="78" height="4" rx="2" fill="#00e5ff"/>
    <rect x="10" y="136" width="95" height="4" rx="2" fill="#0b2c3d"/>
    <rect x="10" y="136" width="62" height="4" rx="2" fill="#38ef7d"/>
    <rect x="10" y="150" width="95" height="4" rx="2" fill="#0b2c3d"/>
    <rect x="10" y="150" width="88" height="4" rx="2" fill="#00d2ff"/>
    <text x="10" y="180" fill="#7edbf0" font-family="monospace" font-size="7">CONFIDENCE: 99.4%</text>
  </g>

  <!-- Central Holographic Human Anatomy Wireframe -->
  <g transform="translate(300, 175)">
    <!-- Aura glow -->
    <ellipse cx="0" cy="0" rx="60" ry="120" fill="#00e5ff" opacity="0.08" filter="url(#neon)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-95" rx="14" ry="18" fill="none" stroke="#00e5ff" stroke-width="1.2" filter="url(#neon)"/>
    <line x1="0" y1="-77" x2="0" y2="-68" stroke="#00e5ff" stroke-width="1.2"/>
    <!-- Torso & Ribs -->
    <path d="M -26 -65 L 26 -65 L 18 10 L -18 10 Z" fill="none" stroke="#00e5ff" stroke-width="1.2" filter="url(#neon)"/>
    <!-- Spine & Neural Line -->
    <line x1="0" y1="-65" x2="0" y2="15" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="2 3" filter="url(#neon)"/>
    <!-- Rib arcs -->
    <path d="M -20 -50 Q 0 -45 20 -50" fill="none" stroke="#00e5ff" stroke-width="0.8"/>
    <path d="M -18 -36 Q 0 -31 18 -36" fill="none" stroke="#00e5ff" stroke-width="0.8"/>
    <path d="M -16 -22 Q 0 -17 16 -22" fill="none" stroke="#00e5ff" stroke-width="0.8"/>
    <!-- Pelvis -->
    <path d="M -20 10 L 20 10 L 14 32 L -14 32 Z" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <!-- Arms -->
    <path d="M -26 -65 L -42 -20 L -50 25" fill="none" stroke="#00d2ff" stroke-width="1.2" filter="url(#neon)"/>
    <path d="M 26 -65 L 42 -20 L 50 25" fill="none" stroke="#00d2ff" stroke-width="1.2" filter="url(#neon)"/>
    <!-- Legs -->
    <path d="M -12 32 L -16 85 L -18 135" fill="none" stroke="#00d2ff" stroke-width="1.2" filter="url(#neon)"/>
    <path d="M 12 32 L 16 85 L 18 135" fill="none" stroke="#00d2ff" stroke-width="1.2" filter="url(#neon)"/>
    <!-- Diagnostic Targeting Points -->
    <circle cx="0" cy="-40" r="4" fill="none" stroke="#ff4757" stroke-width="1.2" filter="url(#neon)"/>
    <circle cx="0" cy="-40" r="1.5" fill="#ff4757"/>
    <circle cx="-16" cy="-20" r="3" fill="none" stroke="#f5d58f" stroke-width="1"/>
    <circle cx="16" cy="-20" r="3" fill="none" stroke="#f5d58f" stroke-width="1"/>
    <circle cx="0" cy="8" r="3.5" fill="none" stroke="#00f0ff" stroke-width="1"/>
    <!-- Rotating Ring Target -->
    <circle cx="0" cy="0" rx="75" ry="75" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.4"/>
  </g>

  <!-- Right HUD graphs and AI scan results -->
  <g transform="translate(440, 45)">
    <rect width="125" height="130" rx="4" fill="#04121d" stroke="#00e5ff" stroke-width="0.6" opacity="0.8"/>
    <text x="10" y="18" fill="#5ce1e6" font-family="monospace" font-size="8" letter-spacing="1">MULTI-DISEASE AI</text>
    <path d="M 10 50 Q 30 25 50 45 T 90 30 T 115 55" fill="none" stroke="#38ef7d" stroke-width="1.2" filter="url(#neon)"/>
    <path d="M 10 80 Q 35 60 65 75 T 115 65" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.8"/>
    <text x="10" y="105" fill="#a4f3ff" font-family="monospace" font-size="7">DIABETES: 0.02</text>
    <text x="10" y="117" fill="#a4f3ff" font-family="monospace" font-size="7">CARDIO: LOW RISK</text>

    <!-- Radar Target Dial -->
    <g transform="translate(60, 185)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0.6"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5"/>
      <line x1="-38" y1="0" x2="38" y2="0" stroke="#00e5ff" stroke-width="0.5" opacity="0.4"/>
      <line x1="0" y1="-38" x2="0" y2="38" stroke="#00e5ff" stroke-width="0.5" opacity="0.4"/>
      <polygon points="0,-18 12,12 -14,8" fill="#00e5ff" opacity="0.25" stroke="#00e5ff" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Upper status bar -->
  <rect x="0" y="0" width="600" height="24" fill="#02080d" opacity="0.8"/>
  <text x="20" y="15" fill="#00f0ff" font-family="monospace" font-size="8" letter-spacing="2">SYS::DIAGNOSTIC_HEALTH_SUITE // FASTAPI // OCR ACTIVE</text>
  <circle cx="575" cy="12" r="3" fill="#38ef7d" filter="url(#neon)"/>
</svg>
